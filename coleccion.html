<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Colección · Museo Seminario</title>
  <link rel="stylesheet" href="css/estilo.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
  <style>
    .pagination { display:flex; align-items:center; justify-content:center; gap:.45rem; padding:2.5rem 0 3rem; flex-wrap:wrap; }
    .pag-btn { min-width:40px; height:40px; border:1.5px solid rgba(212,175,55,.22); background:rgba(212,175,55,.04); color:#a99e8c; border-radius:7px; cursor:pointer; font-size:.88rem; font-family:inherit; letter-spacing:.03em; transition:border-color .16s,color .16s,background .16s; display:flex; align-items:center; justify-content:center; padding:0 .6rem; }
    .pag-btn:hover { border-color:rgba(212,175,55,.6); color:#d4af37; background:rgba(212,175,55,.1); }
    .pag-btn.pag-active { background:rgba(212,175,55,.2); border-color:#d4af37; color:#f0d060; font-weight:700; pointer-events:none; }
    .pag-arrow { color:#d4af37; padding:0 .55rem; }
  </style>
  <script type="importmap">
    {"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.158.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.158.0/examples/jsm/"}}
  </script>
</head>
<body>
  <nav class="navbar">
    <div class="nav-brand">
      <h1>MUSEO SEMINARIO</h1>
      <span>Diocesano de Cristo Sacerdote</span>
    </div>
    <button class="nav-toggle" aria-label="Menú" aria-expanded="false">
      <span></span><span></span><span></span>
    </button>
    <ul class="nav-menu">
      <li><a href="index.html">Inicio</a></li>
      <li><a href="coleccion.html" class="active">Colección</a></li>
      <li><a href="sala-central.html" class="btn-recorrido"><i class="fas fa-vr-cardboard"></i> Recorrido Virtual</a></li>
      <li><a href="sobre-nosotros.html">Sobre Nosotros</a></li>
      <li><a href="qr.html" title="Generar QR"><i class="fas fa-qrcode"></i></a></li>
    </ul>
  </nav>
  <div class="nav-overlay" id="nav-overlay"></div>

  <!-- Pantalla de carga -->
  <div id="col-loading" style="position:fixed;inset:0;z-index:9990;background:#0d0f14;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:1.4rem;">
    <p style="color:#a99e8c;font-size:.85rem;letter-spacing:.1em;text-transform:uppercase;">Cargando Colección</p>
    <div style="width:220px;height:3px;background:rgba(212,175,55,.12);border-radius:2px;overflow:hidden;">
      <div id="col-loading-bar" style="height:100%;width:0%;background:linear-gradient(90deg,#c8a832,#f0d060);border-radius:2px;transition:width .35s ease;"></div>
    </div>
    <p id="col-loading-lbl" style="color:#504540;font-size:.7rem;letter-spacing:.05em;"></p>
  </div>

  <main class="coleccion-page">
    <h2 class="page-title">Colección Completa</h2>
    <p class="page-subtitle">Cultura Malagana · Valle del Cauca · 200 a.C. – 400 d.C.</p>
    <div class="grid-cards" id="pieces-grid"></div>
    <div class="pagination" id="paginacion"></div>
  </main>

  <!-- Modal de detalle -->
  <div id="piece-modal" class="modal">
    <div class="modal-content">
      <span class="close">&times;</span>
      <div class="modal-body">

        <div class="modal-viewer">
          <!-- 3D Canvas -->
          <canvas id="modal-canvas"></canvas>

          <!-- Slideshow: dots top, image below, arrows at sides -->
          <div id="slide-wrap">
            <div class="slide-dots-bar" id="slide-dots"></div>
            <img id="slide-img" src="" alt="Vista de la pieza">
            <div class="slide-arrow" id="slide-prev"><i class="fas fa-chevron-left"></i></div>
            <div class="slide-arrow" id="slide-next"><i class="fas fa-chevron-right"></i></div>
          </div>

          <!-- QR -->
          <div id="qr-wrap"></div>

          <!-- Bottom bar: controls always visible, never on top of content -->
          <div class="media-controls">
            <button id="view-3d"     class="active"><i class="fas fa-cube"></i> 3D</button>
            <button id="view-images"><i class="fas fa-image"></i> Imágenes</button>
            <button id="view-qr"    ><i class="fas fa-qrcode"></i> QR</button>
            <button id="btn-zoom"   style="margin-left:auto;" title="Pantalla completa"><i class="fas fa-expand-alt"></i></button>
          </div>
        </div>

        <div class="modal-info">
          <h3 id="modal-title"></h3>
          <p id="modal-provenance"></p>
          <p id="modal-description"></p>
          <div id="modal-metadata"></div>
        </div>
      </div>
    </div>
  </div>

  <footer>
    <p>© 2026 Museo Seminario Diocesano de Cristo Sacerdote · Colección Malagana</p>
  </footer>
  <script>
    // Hard fallback: hide loading overlay after 4s max regardless of module load
    setTimeout(function(){
      var ov = document.getElementById('col-loading');
      if (ov && ov.style.display !== 'none') {
        ov.style.transition = 'opacity .5s'; ov.style.opacity = '0';
        setTimeout(function(){ ov.style.display = 'none'; }, 500);
      }
    }, 4000);
    (function(){
      var toggle = document.querySelector('.nav-toggle');
      var menu   = document.querySelector('.nav-menu');
      var overlay= document.getElementById('nav-overlay');
      function open(){ menu.classList.add('open'); overlay.classList.add('open'); toggle.classList.add('open'); toggle.setAttribute('aria-expanded','true'); document.body.style.overflow='hidden'; }
      function close(){ menu.classList.remove('open'); overlay.classList.remove('open'); toggle.classList.remove('open'); toggle.setAttribute('aria-expanded','false'); document.body.style.overflow=''; }
      toggle.addEventListener('click', function(){ menu.classList.contains('open') ? close() : open(); });
      overlay.addEventListener('click', close);
      menu.querySelectorAll('a').forEach(function(a){ a.addEventListener('click', close); });
    })();
  </script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
  <script type="module" src="js/main.js"></script>
</body>
</html>
